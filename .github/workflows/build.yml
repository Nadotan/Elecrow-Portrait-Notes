
name: Build Elecrow Notes V2 - verify firmware layout

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'NotesUI.h'
      - 'prepare.py'
      - 'partitions.csv'
      - 'verify_firmware.py'

jobs:
  firmware:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download official Elecrow V1.2 sources
        run: |
          git clone --depth 1 \
            https://github.com/Elecrow-RD/CrowPanel-Advanced-9inch-ESP32-P4-HMI-AI-Display-1024x600-IPS-Touch-Screen.git vendor

      - name: Prepare sketch and official libraries
        run: |
          python prepare.py
          mkdir -p "$HOME/Arduino/libraries"
          cp -a vendor/example/V1.2/Arduino_Code/libraries/. \
            "$HOME/Arduino/libraries/"

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32-P4 core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.2

      - name: Compile ESP32-P4 firmware
        run: |
          mkdir -p firmware
          arduino-cli compile \
            --fqbn esp32:esp32:esp32p4:PSRAM=enabled,FlashSize=16M \
            --build-property "compiler.cpp.extra_flags=-I${{ github.workspace }}/Sketch/Sketch" \
            --output-dir firmware \
            Sketch/Sketch

      - name: Verify actual flash image and partition table
        run: python verify_firmware.py

      - name: Publish ONLY verified merged image
        uses: actions/upload-artifact@v4
        with:
          name: ELECROW-16MB-LAYOUT-VERIFIED-NOT-HARDWARE-TESTED
          path: firmware/Sketch.ino.merged.bin
          if-no-files-found: error
